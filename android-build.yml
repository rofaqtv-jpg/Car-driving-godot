name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android Export Template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: 🔑 Setup Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: 🏗️ Import Project
        run: |
          godot --headless --import --quit || true

      - name: 📱 Build APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/qimmat-al-suoud.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qimmat-Al-Suoud-APK
          path: build/qimmat-al-suoud.apk

      - name: 📋 Build Summary
        if: always()
        run: |
          echo "=== Build Results ==="
          ls -lh build/ || echo "No build output"
