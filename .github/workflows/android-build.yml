name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Files
        run: |
          echo "=== الملفات الموجودة ==="
          ls -la
          echo ""
          echo "=== فحص الملفات المطلوبة ==="
          [ -f "project.godot" ] && echo "✅ project.godot" || echo "❌ project.godot مفقود"
          [ -f "export_presets.cfg" ] && echo "✅ export_presets.cfg" || echo "❌ export_presets.cfg مفقود"
          [ -f "main.tscn" ] && echo "✅ main.tscn" || echo "❌ main.tscn مفقود"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" 2>/dev/null
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0" 2>/dev/null
          echo "✅ Android SDK جاهز"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          echo "✅ Godot $(godot --version) مثبت"

      - name: Download Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip -q Godot_v4.2.2-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.2.2.stable/
          rm -rf templates Godot_v4.2.2-stable_export_templates.tpz
          echo "✅ القوالب جاهزة"

      - name: Create Keystore
        run: |
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          echo "✅ Keystore جاهز"

      - name: Import Project
        run: |
          echo "=== استيراد المشروع ==="
          timeout 60 godot --headless --import --quit 2>&1 || echo "⚠️ الاستيراد انتهى مع تحذيرات"

      - name: Build APK
        run: |
          echo "=== بناء APK ==="
          mkdir -p build
          
          godot --headless --export-release "Android" build/qimmat-al-suoud.apk 2>&1
          EXIT_CODE=$?
          
          echo ""
          echo "رمز الخروج: $EXIT_CODE"
          ls -la build/ 2>/dev/null || echo "لا يوجد ملفات في build/"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ البناء فشل!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qimmat-Al-Suoud-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════"
          if [ -f "build/qimmat-al-suoud.apk" ]; then
            echo "✅ APK تم بناؤه بنجاح!"
            echo "📦 الحجم: $(du -h build/qimmat-al-suoud.apk | cut -f1)"
          else
            echo "❌ لم يتم إنشاء APK"
          fi
          echo "═══════════════════════════"
